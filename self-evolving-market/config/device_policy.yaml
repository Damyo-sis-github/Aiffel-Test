# 기기 가시성 정책 (§11.8 전제, §17 "기기 감사 레벨")
#
# 명세 v0.5 §11.8 의 원문 전제는 **레벨 ≤ 1** 이다.
# 이 파일은 그 전제를 실제 운영 조건으로 옮긴 것이고, 예외를 두려면
# 여기에 **명시적으로** 적어야 한다. 문서와 실제가 다르면 스스로를 속이게 된다.
#
# 레벨 정의는 app/guards/device_audit.py 참조.
#   0 연결 없음 / 1 계정 경로 동기화 / 2 기기 등록 / 3 MDM / 4 EDR·문서보안

max_level: 1

# ── 예외 승인 ────────────────────────────────────────────────────
# 레벨 2(기기 등록)까지 허용할지. 사람이 명시적으로 켜야 한다.
#
# 근거: WorkplaceJoined(Azure AD Registered)는 개인 소유 기기를 회사 계정에
#       등록한 상태이고, MdmUrl 이 없으면 관리자가 보는 것은 기기 메타데이터뿐이다
#       (기기명·OS·모델·로그인 시각). 파일·프로세스·앱 목록은 보지 못한다.
#
# 대가: 회사가 Intune 을 활성화하면 이미 등록된 기기는 **사용자 동의 없이**
#       MDM 으로 승격될 수 있다. 그래서 이 예외를 켜면 daily 가 매번 MdmUrl 을
#       확인하고, 값이 생기는 순간 실행을 멈추고 텔레그램을 보낸다.
overrides:
  allow_registered_without_mdm: false
  reason: ""
  acknowledged_by: ""
  acknowledged_at: ""

# ── 어떤 예외로도 허용하지 않음 ──────────────────────────────────
# 이 둘은 폴더 위치·네트워크 가드로 막을 수 없다. 감지되면 무조건 거부한다.
never_allow:
  - mdm            # 레벨 3. 앱 목록·정책·원격 스크립트가 열린다
  - agent          # 레벨 4. 프로세스 실행 기록과 파일 접근이 수집된다

# ── 승격 감시 ────────────────────────────────────────────────────
# 마지막 감사 결과를 state/device_audit.json 에 저장하고, 레벨이 올라가면
# 실행을 멈추고 즉시 알린다. "오늘 레벨 2 → 내일 레벨 3" 을 잡는 장치다.
watch_promotion: true

# Windows 전용 검사다. 다른 OS 에서는 건너뛴다 —
# 실집행은 allowed_hosts 에 등록된 그 Windows 노트북에서 일어나기 때문이다.
skip_on_non_windows: true
