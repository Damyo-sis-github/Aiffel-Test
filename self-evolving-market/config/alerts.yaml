# §11.6 알림. 자격증명은 .env 에만. 이 파일에 토큰을 적지 않는다(#17).

channels:
  telegram:
    enabled: true
    primary: true
    # .env: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
    levels: [critical, error, warn, info]
    purposes:
      - 장애
      - 데이터 게이트 중단(G3)
      - 킬스위치
      - protected.lock 해시 불일치
      - 진화 결과
      - 크레딧 소진 / claude -p 실패
      - 일일 요약
      - 가드 거부(기기·네트워크·경로)
    max_lines: 10               # §13.1 텔레그램 요약 10줄 상한
  kakao:
    enabled: false
    primary: false
    # .env: KAKAO_ACCESS_TOKEN, KAKAO_REFRESH_TOKEN
    levels: [info]
    purposes: [일일 요약, 주간 요약]
    # 토큰 만료 시 텔레그램으로 대체 알림
    fallback_channel: telegram

# 전송 실패는 alerts 테이블에 기록하고 다음 실행에서 재전송한다.
retry:
  max_attempts: 5
  resend_on_next_run: true

# 오프라인/CI 에서는 콘솔로만 출력한다.
offline_console_only: true
