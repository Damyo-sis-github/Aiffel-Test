# §7.3 비용 모델. 백테스트 엔진에서 **필수 인자**이며 기본값 없음(#3).
# 이 파일이 없거나 키가 비면 엔진은 예외를 던진다.
# TODO(§17): 2026 거래세·수수료 실값 확인 필요. 아래는 초기값.

markets:
  KR:
    commission_rate: 0.00015        # 0.015%
    sell_tax_rate: 0.0018           # 매도 거래세 (2026 확인 필요)
    slippage_rate: 0.001            # 0.1%
    fractional_shares: false
    lot_size: 1
    currency: KRW
  US:
    commission_rate: 0.0
    sec_fee_rate: 0.0000278         # 매도 시 SEC fee (요율 변동, 확인 필요)
    slippage_rate: 0.0005           # 0.05%
    fractional_shares: true
    min_fraction: 0.01              # 소수점 0.01주
    lot_size: 1
    currency: USD

instruments:
  stock:
    extra_expense_ratio: 0.0
  etf:
    extra_expense_ratio: 0.0
  country_etf:
    extra_expense_ratio: 0.0
  lev_etf:
    extra_expense_ratio: 0.009      # 운용보수 연 0.9% 일할
    slippage_rate_override: 0.001
  inv_etf:
    extra_expense_ratio: 0.009
    slippage_rate_override: 0.001

short:
  borrow_fee_annual: 0.02           # US 대차수수료 연 2% 근사 (Phase 4 실데이터)
  entry_slippage_multiplier: 1.5
  hard_to_borrow_symbols: []        # 제외 리스트

liquidity:
  adv20_participation_threshold: 0.01   # 주문 > adv20*1% 이면
  slippage_multiplier: 2.0              # 슬리피지 x2

delisting:
  forced_exit_price_ratio: 0.50     # 마지막가 50% 강제 청산
  short_exit_at_last_price: true    # 공매도 종목 상폐 = 전액 이익 아님

# 연중 거래일 수 (일할 계산 기준)
trading_days_per_year: 252
