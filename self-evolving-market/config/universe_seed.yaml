# 실운영(offline: false)에서는 pykrx/fdr 로 KOSPI200·KOSDAQ150·S&P500·Nasdaq100 구성종목을
# 스냅샷 시점 기준으로 가져오고, 이 목록은 그 조회가 실패했을 때의 폴백 + 오프라인 데모용이다.
#
# 유동성 필터: KR adv20 >= 10억 원, US adv20 >= $5M (아래 liquidity 참조)
# 관리·거래정지 종목은 실운영 조회 시 제외한다.

