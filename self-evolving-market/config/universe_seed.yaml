  KR: {adv20_min: 1_000_000_000, currency: KRW}
  US: {adv20_min: 5_000_000, currency: USD}

# 벤치마크 지수. 실모드에서는 FinanceDataReader/yfinance 심볼로 그대로 조회된다.
