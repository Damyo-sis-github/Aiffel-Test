name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# §12 안전장치 테스트가 CI 의 본체다. 하나라도 깨지면 머지하지 않는다.
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      QUANT_GUARD_BYPASS: "1"      # CI 는 등록된 기기·네트워크가 아니다
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: 의존성 설치
        run: |
          uv venv .venv --python 3.11
          . .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: 린트
        run: |
          . .venv/bin/activate
          ruff check app tests

      - name: 실계좌 주문 코드 검사 (#16)
        run: |
          . .venv/bin/activate
          pytest -q tests/test_source_policy.py

      - name: 시크릿 스캔 (#17)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: 안전장치 테스트 전체 (§12 #1~#34)
        run: |
          . .venv/bin/activate
          pytest -q

      - name: protected.lock 일치 확인 (#6)
        run: |
          . .venv/bin/activate
          python -m app.cli lock

  # 워킹 트리가 아니라 **커밋된 것만으로** 도는지 본다.
  # .gitignore 의 `data/` 한 줄이 app/data/ 를 통째로 제외해 클론한 사람만
  # ModuleNotFoundError 를 만난 적이 있다. 내 디스크엔 파일이 있어 테스트가
  # 전부 통과했기 때문에 끝까지 드러나지 않았다.
  clean-clone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 소스가 .gitignore 에 먹히지 않았는지
        working-directory: self-evolving-market
        run: |
          set -e
          missing=0
          while IFS= read -r f; do
            if git check-ignore -q "$f"; then echo "무시됨: $f"; missing=1; fi
          done < <(find app tests config windows scripts .claude .codex -type f ! -path '*__pycache__*')
          if [ "$missing" -ne 0 ]; then
            echo "::error::소스 파일이 .gitignore 에 걸렸습니다. 클론한 사람은 이 파일들을 못 받습니다."
            exit 1
          fi
          echo "커밋된 .py: $(git ls-files 'app/**/*.py' | wc -l) / 디스크: $(find app -name '*.py' ! -path '*__pycache__*' | wc -l)"

      - uses: astral-sh/setup-uv@v3
      - name: 커밋된 파일만으로 전체 임포트
        working-directory: self-evolving-market
        env:
          PYTHONUTF8: "1"
        run: |
          git clean -xdff .          # 추적되지 않는 파일 전부 제거
          uv venv .venv --python 3.11
          . .venv/bin/activate
          uv pip install -e ".[dev]"
          python - <<'PY'
          import importlib, pkgutil, sys
          import app
          bad = []
          for m in pkgutil.walk_packages(app.__path__, "app."):
              try:
                  importlib.import_module(m.name)
              except Exception as exc:
                  bad.append(f"{m.name}: {type(exc).__name__}: {exc}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("전체 모듈 임포트 OK")
          PY

  smoke:
    runs-on: ubuntu-latest
    needs: [test, clean-clone]
    env:
      PYTHONUTF8: "1"
      QUANT_GUARD_BYPASS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: 엔드투엔드 스모크 (합성 데이터)
        run: |
          uv venv .venv --python 3.11
          . .venv/bin/activate
          uv pip install -e ".[dev]"
          export QUANT_ROOT=$PWD
          python -m app.cli backfill --date 2020-12-31 --start 2018-01-01
          python -m app.cli lock --update --ack --reason ci
          python -m app.cli daily --date 2020-12-28 --skip-guards
          python -m app.cli daily --date 2020-12-29 --skip-guards
          python -m app.cli replay --date 2020-12-29
