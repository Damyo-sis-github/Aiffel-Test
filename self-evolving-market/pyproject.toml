[project]
name = "self-evolving-market"
version = "0.5.0"
description = "자가 발전형 시장 리서치 프로그램 (백테스트 + 페이퍼 트레이딩 전용)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "duckdb>=1.0",
    "pyyaml>=6",
]

[project.optional-dependencies]
# 실제 시장 데이터 소스. 없으면 synthetic 소스로 자동 폴백한다(오프라인/CI).
market = [
    "yfinance>=0.2.40",
    "pykrx>=1.0.45",
    "finance-datareader>=0.9.50",
    "fredapi>=0.5",
    "httpx>=0.27",
]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6"]

[project.scripts]
quant = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: 느린 테스트", "network: 네트워크 필요"]
filterwarnings = ["ignore::DeprecationWarning"]
